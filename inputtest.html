<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>테이블 연습</title>
</head>
<body>
    <table border="1" cellspacing="0" cellpadding="0"width="500" height="400">
        <tr bgcolor="pink">
            <th><font color="blue"> 월</font></th>
            <th>화</th>
            <th>수</th>
        </tr>
        <tr align="center"> <!--해당줄 (행row)에 있는 셀들을 모두 가운데 정렬 적용-->
            <td bgcolor="red" colspan="2">수학</td>
            <!-- <td align="right">과학</td> -->
            <td align="left">미술</td>
        </tr>
        <tr>
            <td align="center">체육</td>
            <td>수학</td>
            <td rowspan="2" valign="top">과학</td>
        </tr>
        <tr>
            <td>음학</td>
            <td>국어</td>
            <!-- <td>사회</td> -->
        </tr>


    </table>
</body>
</html>
