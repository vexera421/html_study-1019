<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>html 연습</title>
</head>
<body>
    <h1>안녕하세요</h1>
     <h2>안녕하세요</h2>
      <h3>안녕하세요</h3>
       <h4>안녕하세요</h4>
        <h5>안녕하세요</h5>
         <h6>안녕하세요</h6>
    <hr>

    <p>html<br><em>공부를</em><br>시작합니다</p><!--강조의 의미를 표현-->
    <strong>중요한 내용</strong><!--중요하다는 강조의 의미-->
    <hr>
    <p><b>굵은 글자</b></p><!--단순하게 글자를 굵게 표시-->
    <p><i>기울어진 글자</i></p><!--이탤릭체 글자를 기울여서 표시 -->
    <p><u>밑줄이 있는 글자</u></p><!--밑줄을 표시-->
    <p><del>삭제된 내용을 표시 </del></p><!--삭제된(취소된) 내용을 표시-->
    <p></p><mark>형광펜 같은 글씨 효과</mark><!--형광펜처럼 강조-->
    
</body>
</html>
